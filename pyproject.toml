[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tray"
version = "1.0.0"
description = "Minimal system-tray manager for local and SSH Codex CLI and Claude Code CLI sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Heimao-c"}]
keywords = ["codex", "claude", "claude-code", "system-tray", "appindicator", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
portable-tray = [
  "Pillow>=10.0",
  "pystray>=0.19.5",
  "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
]
build = [
  "PyInstaller>=6.0",
  "Pillow>=10.0",
  "pystray>=0.19.5",
  "pyobjc-framework-Cocoa>=9.0; sys_platform == 'darwin'",
]

[project.scripts]
agent-tray = "agent_tray.cli:main"

[project.urls]
Homepage = "https://github.com/Heimao-c/agent-tray"
Issues = "https://github.com/Heimao-c/agent-tray/issues"
Source = "https://github.com/Heimao-c/agent-tray"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_tray = ["assets/*.svg"]
