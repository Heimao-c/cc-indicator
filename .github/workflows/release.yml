name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Build tray and hook executables
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AgentTray --paths src --collect-submodules pystray --add-data "src/agent_tray/assets;agent_tray/assets" src/agent_tray/__main__.py
          pyinstaller --noconfirm --clean --console --onedir --name AgentTrayHook --paths src --collect-submodules pystray --add-data "src/agent_tray/assets;agent_tray/assets" src/agent_tray/__main__.py
          if (-not (Test-Path dist/AgentTray/AgentTray.exe)) { throw "Tray executable was not built" }
          & dist/AgentTrayHook/AgentTrayHook.exe --version
          New-Item -ItemType Directory -Path bundle
          Move-Item dist/AgentTray bundle/AgentTray
          Move-Item dist/AgentTrayHook bundle/AgentTrayHook
          Compress-Archive -Path bundle/* -DestinationPath agent-tray-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tray-windows-x64
          path: agent-tray-windows-x64.zip

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ".[build]"
      - name: Build menu-bar app and hook executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name AgentTray --paths src --collect-submodules pystray --add-data "src/agent_tray/assets:agent_tray/assets" src/agent_tray/__main__.py
          pyinstaller --noconfirm --clean --console --onedir --name AgentTrayHook --paths src --collect-submodules pystray --add-data "src/agent_tray/assets:agent_tray/assets" src/agent_tray/__main__.py
          test -d dist/AgentTray.app
          dist/AgentTrayHook/AgentTrayHook --version
          mkdir bundle
          mv dist/AgentTray.app bundle/
          mv dist/AgentTrayHook bundle/
          ditto -c -k --sequesterRsrc --keepParent bundle agent-tray-macos-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tray-macos-${{ matrix.architecture }}
          path: agent-tray-macos-${{ matrix.architecture }}.zip

  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build deb
        run: sh scripts/build-deb.sh "${GITHUB_REF_NAME#v}" amd64
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tray-ubuntu-amd64
          path: dist/*.deb

  publish:
    needs: [build-windows, build-macos, build-ubuntu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-tray-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
